name: 🔄 Update Instagram Posts 2x Daily

on:
  schedule:
    # Runs at 8:00 AM and 8:00 PM Puerto Rico time (UTC-4)
    - cron: '0 12 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

concurrency:
  group: instagram-posts-main
  cancel-in-progress: false

jobs:
  fetch-instagram:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch Instagram posts
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_API_VERSION: v25.0
        run: python fetch_posts.py

      - name: Validate generated feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('posts.json').read_text(encoding='utf-8'))
          posts = payload.get('posts', [])
          assert payload.get('source') == 'instagram_graph_api', 'Unexpected feed source'
          assert posts, 'Instagram feed contains no posts'
          assert all(p.get('media_url') or p.get('thumbnail_url') for p in posts), 'Post missing media URL'
          print(f'Validated {len(posts)} Instagram posts.')
          PY

      - name: Commit and push if posts changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add posts.json
          if git diff --staged --quiet; then
            echo "Instagram posts are already current."
            exit 0
          fi
          git commit -m "chore: update Instagram posts [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
