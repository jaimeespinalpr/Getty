name: 🔄 Update Instagram Posts 2x Daily

on:
  schedule:
    # Runs at 8:00 AM and 8:00 PM Puerto Rico time (UTC-4)
    - cron: '0 12 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  fetch-instagram:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Instagram posts
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python fetch_posts.py

      - name: Commit and push if posts changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add posts.json
          git diff --staged --quiet || git commit -m "chore: update Instagram posts [skip ci]"
          git push
