name: 📅 Sync Airbnb Calendar

on:
  schedule:
    # Cada 3 horas — mantiene la disponibilidad sincronizada con Airbnb
    - cron: '0 */3 * * *'
  workflow_dispatch: # Permitir ejecución manual desde GitHub
  push:
    branches: [main]
    paths:
      - 'bookings.json' # Al registrar una reserva web, regenerar todo

jobs:
  sync-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync calendar (Airbnb iCal + web bookings)
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
        run: python sync_calendar.py

      - name: Commit and push if availability changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add availability.json ghetty-web-bookings.ics
          git diff --staged --quiet || git commit -m "chore: sync availability calendar [skip ci]"
          git push
